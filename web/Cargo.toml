[package]
name = "wyrdmate-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Wyrdmate engine compiled to WebAssembly for the browser play page"

[lib]
crate-type = ["cdylib"]

[dependencies]
wyrdmate-engine = { path = "../engine" }
cozy-chess = "0.3.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
