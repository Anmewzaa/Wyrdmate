name: Deploy web demo to GitHub Pages

# Builds web/ (the engine as WebAssembly + the play page) and publishes web/dist.
# One-time setup in the repo: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [master]
    paths: [web/**, engine/**, nets/**, scripts/play.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Build web/dist
        run: bash web/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
