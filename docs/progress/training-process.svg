<text x="510" y="950" font-size="11" font-weight="400" fill="#6b6a66" text-anchor="middle">0</text>
<line x1="560" y1="230" x2="560" y2="934" stroke="#e1e0d9"/>
<text x="560" y="950" font-size="11" font-weight="400" fill="#6b6a66" text-anchor="middle">100</text>
<line x1="610" y1="230" x2="610" y2="934" stroke="#e1e0d9"/>
<text x="610" y="950" font-size="11" font-weight="400" fill="#6b6a66" text-anchor="middle">200</text>
