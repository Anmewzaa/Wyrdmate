<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1014" viewBox="0 0 940 1014" font-family="Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Wyrdmate · Training process">
<rect width="940" height="1014" fill="#ffffff"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1f1f1e" text-anchor="start">Wyrdmate · Training process</text>
<text x="24" y="58" font-size="13" font-weight="400" fill="#6b6a66" text-anchor="start">Does each newly trained net beat its opponent? (head-to-head matches)</text>
<rect x="24" y="70" width="892" height="104" rx="6" fill="#f6f5f0"/>
<text x="40" y="96" font-size="12" font-weight="400" fill="#1f1f1e" text-anchor="start">How to read: bar to the right = the net is stronger than its opponent, to the left = weaker, 0 = equal.</text>
<text x="40" y="119" font-size="12" font-weight="400" fill="#1f1f1e" text-anchor="start">Whisker = error margin. If it crosses the 0 line, we cannot tell the difference from luck.</text>
<text x="40" y="142" font-size="12" font-weight="400" fill="#1f1f1e" text-anchor="start">Elo = relative strength. +100 means scoring about 64% of the points per game, +200 about 76%.</text>
<text x="40" y="165" font-size="12" font-weight="400" fill="#1f1f1e" text-anchor="start">&quot;Material eval&quot; = the original engine that scores positions by piece values only (no net).</text>
<text x="500" y="216" font-size="12" font-weight="400" fill="#6b6a66" text-anchor="end">&lt; weaker</text>
<text x="520" y="216" font-size="12" font-weight="400" fill="#6b6a66" text-anchor="start">stronger &gt;</text>
<line x1="360" y1="230" x2="360" y2="934" stroke="#e1e0d9"/>
<text x="360" y="950" font-size="11" font-weight="400" fill="#6b6a66" text-anchor="middle">-300</text>
