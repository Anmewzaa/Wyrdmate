<text x="660" y="950" font-size="11" font-weight="400" fill="#6b6a66" text-anchor="middle">300</text>
<text x="510" y="972" font-size="12" font-weight="400" fill="#6b6a66" text-anchor="middle">Elo difference vs opponent (0 = equal)</text>
